name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deploy
        id: method
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Using Vercel Deploy Hook..."
            curl -fsSL -X POST "$DEPLOY_HOOK"
            echo "Deploy started. Live site updates in ~2-4 min."
            exit 0
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Setup required (2 min)::Add GitHub secret VERCEL_DEPLOY_HOOK — easiest option:"
            echo "1. Vercel -> ruks-website -> Settings -> Git -> Deploy Hooks"
            echo "2. Create hook for branch main, copy the URL"
            echo "3. GitHub -> Ruks-Website -> Settings -> Secrets -> Actions -> New -> VERCEL_DEPLOY_HOOK"
            echo "OR add VERCEL_TOKEN from https://vercel.com/account/tokens"
            exit 1
          fi
          echo "use_cli=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.method.outputs.use_cli == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.method.outputs.use_cli == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy via CLI
        if: steps.method.outputs.use_cli == 'true'
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
